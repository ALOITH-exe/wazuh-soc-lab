<!--
  Wazuh Manager - Main Configuration File
  Remove API keys and passwords before sharing publicly
-->

<ossec_config>
  <cluster>
    <name>wazuh-server</name>
    <node_name>node-01</node_name>
    <node_type>master</node_type>
    <key>YOUR_CLUSTER_KEY</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>127.0.0.1</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
    <ignore_time>6h</ignore_time>
    
    <!-- Ubuntu vulnerabilities -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>
    
    <!-- Windows vulnerabilities -->
    <provider name="msu">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <syscollector>
    <enabled>yes</enabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports>yes</ports>
    <processes>yes</processes>
  </syscollector>

  <!-- Shuffle SOAR Integration -->
  <integration>
    <name>shuffle</name>
    <hook_url>https://shuffler.io/api/v1/hooks/YOUR_WEBHOOK_ID</hook_url>
    <level>3</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- VirusTotal Integration -->
  <integration>
    <name>virustotal</name>
    <api_key>YOUR_VIRUSTOTAL_API_KEY</api_key>
    <group>syscheck</group>
    <alert_format>json</alert_format>
  </integration>

  <ruleset>
    <include>rules_config.xml</include>
    <include>ruleset/ruleset.xml</include>
    <include>etc/rules/local_rules.xml</include>
    <!-- CDB Lists -->
    <list>etc/lists/audit-keys</list>
  </ruleset>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <alerts>
    <log_format>json</log_format>
  </alerts>
</ossec_config>
